<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GERECIAMENTO DE DÍVIDAS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>GERECIAMENTO DE DÍVIDAS</h1>
        <p>Cadastro e controle de divídas de clientes</p>
    </header>

    <main>
        <section>
            <h2>Cadastro de dívida</h2>
            <div id="mensagemErro" class="mensagemErro"></div>
            <form id="formDivida" novalidate>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required placeholder="Digite o nome do cliente">

                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf" required placeholder="Digite o CPF do cliente">

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required placeholder="Digite o email do cliente">

                <label for="valor">Valor:</label>
                <input type="number" id="valor" name="valor" required placeholder="Digite o valor da dívida">

                <label for="descricao">Descrição:</label>
                <textarea id="descricao" name="descricao" required placeholder="Digite a descrição da dívida"></textarea>

                <label for="situacao">Situação:</label>
                <select id="situacao" name="situacao" required>
                    <option value="">Selecione</option>
                    <option value="Pendente">Pendente</option>
                    <option value="Pago">Paga</option>
                </select>

                <h3>Endereço (Opcional)</h3>
                <label for="cep">CEP:</label>
                <input type="text" id="cep" name="cep" placeholder="Digite o CEP">

                <label for="numero">Número:</label>
                <input type="text" id="numero" name="numero" placeholder="Digite o número">

                <label for="complemento">Complemento:</label>
                <input type="text" id="complemento" name="complemento" placeholder="Digite o complemento">

                <label for="processo">Número do Processo:</label>
                <input type="text" id="processo" name="processo" placeholder="Digite o número do processo">

                <label for="comprovante">Comprovante em PDF:</label>
                <input type="file" id="comprovante" name="comprovante" accept=".pdf,application/pdf">

                <button type="submit">Cadastrar Dívida</button>
            </form>

        </section>

        <section id="listagem">
            <h2>Dívidas cadastradas</h2>

            <div id="lista-dividas">
                <p>Carregando dívidas...</p>
            </div>

            <p id="mensagem"></p>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
